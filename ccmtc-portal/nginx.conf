server {
    listen 80;

    # 計分系統（更具體的路徑必須在競賽入口之前）
    location /competition/scoring {
        proxy_pass http://scoring_web:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 競賽入口網站（靜態 HTML，剝除 /competition/ 前綴）
    location /competition/ {
        proxy_pass http://portal_web:3030/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /competition {
        return 301 /competition/;
    }

    # 成果發佈中心
    location /results {
        proxy_pass http://results_web:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 主站
    location / {
        proxy_pass http://ccmtc_official:3040;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
