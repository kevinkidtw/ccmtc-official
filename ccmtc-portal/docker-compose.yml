version: '3.8'

services:
  portal:
    build: .
    container_name: ccmtc-portal
    restart: unless-stopped
    user: "0:0"
    ports:
      - "3040:3040"
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - SITE_URL=https://ccmtc.mooo.com
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN 未設定，請確認同目錄的 .env}
      - RESULTS_URL=/results
      # 說明站通行碼：2026-11 起全部公開（sites.mjs 的 auth 為 null），目前未使用。
      # 若要恢復，值只寫在 NAS 的 .env，不進原始碼也不進 git。
      - SQUID_PASS=${SQUID_PASS:-}
      - ROBOT_PASS=${ROBOT_PASS:-}
      - R4M_PASS=${R4M_PASS:-}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/public/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 成果發佈中心 (對應本地「ccmtc-results」目錄，遠端 NAS 資料夾為 ../ccmtc-results)
  results:
    build: ../ccmtc-results
    container_name: ccmtc-results
    restart: unless-stopped
    user: "0:0"
    expose:
      - "3010"
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - SITE_URL=https://ccmtc.mooo.com/results
      - ADMIN_TOKEN=${ADMIN_TOKEN:?ADMIN_TOKEN 未設定，請確認同目錄的 .env}
    volumes:
      - ../ccmtc-results/data:/app/data
      - ../ccmtc-results/uploads:/app/public/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 競賽管理系統（ccmtc-competition）已於 2026-11-18 封存下線：
  # /competition 改由 guides 容器內的凍結鏡像提供（ccmtc-guides/archives/competition）。
  # 程式與資料庫保留在 NAS 的 ../ccmtc-competition，備份見 ../ccmtc-backups-safety/。

  # 魷來魷去 AI 教材站（squid）、智創機器人說明站（robot）、機關王 R4M 說明站（r4m）
  # 原本各自一個 nginx 容器，2026-11-23 併入下方 guides（site/squid、site/robot、site/r4m）。
  # 內容仍在各自的專案維護：../squid-portal、../robot-guide、../r4m-guide。

  # 官網共用靜態說明站（對應 NAS 的 ../ccmtc-guides，純靜態 nginx）
  # 每站一個資料夾，路徑由 portal 的 src/config/sites.mjs 決定
  # （drone、drone-awards、competition、robot、r4m、squid）。
  guides:
    image: nginx:alpine
    container_name: ccmtc-guides
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ../ccmtc-guides/site:/usr/share/nginx/html:ro
      - ../ccmtc-guides/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
